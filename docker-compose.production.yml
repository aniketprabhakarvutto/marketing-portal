services:
  vortex-veri:
    build: .
    restart: unless-stopped
    env_file: deploy/production.env
    ports:
      - "127.0.0.1:8787:8787"
    # Use /readyz (DB check) rather than /healthz so a proxy only routes once ready.
    volumes:
      - /srv/vortex-veri/data:/data
      - /srv/vortex-veri/backups:/app/backups
  marketing-analytics-runner:
    build: .
    profiles: ["automation"]
    env_file: deploy/production.env
    environment:
      MARKETING_ANALYTICS_WRITE: "${MARKETING_ANALYTICS_WRITE:-0}"
      MARKETING_DEMAND_EXPORT: "${MARKETING_DEMAND_EXPORT:-}"
      MARKETING_SUPPLY_EXPORT: "${MARKETING_SUPPLY_EXPORT:-}"
      MARKETING_ANALYTICS_MONTH: "${MARKETING_ANALYTICS_MONTH:-}"
    volumes:
      - /srv/vortex-veri/data:/data
      - /srv/vortex-veri/backups:/app/backups
    command: ["python", "-m", "scripts.run_marketing_analytics"]
